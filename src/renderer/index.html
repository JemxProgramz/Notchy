<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notch</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="native.css">
</head>
<body>
<div class="screen" id="scr">
<svg class="t" viewBox="0 0 800 300" preserveAspectRatio="none"><g fill="none" stroke="#2a2418" stroke-width="5" stroke-linecap="round"><path d="M0 300C150 190 300 190 460 150S700 90 800 80"/><path d="M0 260C140 170 300 175 450 135S690 80 800 62" opacity=".7"/><path d="M0 220C150 150 290 160 440 120S690 70 800 48" opacity=".5"/></g></svg>
<div class="night" id="night"></div><div class="dim" id="dim"></div>
<div class="island" id="isl" role="region" aria-label="Notch"><span class="cam"></span><div class="eq" id="eq"><span class="ca"></span><div class="wf"><u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u></div></div>
<div class="pk" id="pk"><div class="media"><div class="art"></div><div class="mt"><h4>Nothing playing</h4><p>Start a player, or press play for lofi radio</p></div><button class="cb" id="pkx" aria-label="Expand"></button></div><div class="bar"><span id="pkt">0:00</span><i><u id="pkb"></u><input class="media-seek" type="range" min="0" max="1000" value="0" aria-label="Seek in current media" disabled></i><span id="pkd">0:00</span></div><div class="ctl"><button class="cb" id="pkprev" aria-label="Previous"></button><button class="cb p" id="pkpp" aria-label="Play or pause"></button><button class="cb" id="pknext" aria-label="Next"></button></div></div>
<div class="in" id="in">
<nav id="nav" aria-label="Notch sections"></nav><div class="dd" id="dd" role="menu"></div>

<section class="v on" id="v-controls"><div class="g" style="grid-template-columns:repeat(6,1fr)" id="tiles"></div>
<div id="wireless-popover" class="wireless-popover" role="region" aria-label="Wireless controls" aria-live="polite" aria-hidden="true" aria-busy="false"></div>
<div class="row" style="margin-top:10px"><div class="vol disabled"><span class="vi" id="bic"></span><input type="range" min="0" max="100" value="100" id="br" aria-label="Brightness" disabled><b id="bp">Checking...</b></div><div class="vol"><span class="vi" id="vic"></span><input type="range" min="0" max="100" value="59" id="vol" aria-label="Windows master volume"><b id="vp">59%</b></div></div>
<div class="tile media" style="margin-top:10px;border-radius:18px;padding:12px 14px"><div class="bar" style="font-size:11px" id="spk"></div>
<div class="art"></div><div class="mt"><h4>Nothing playing</h4><p>Start a player, or press play for lofi radio</p><canvas id="vz" width="260" height="22" style="width:100%;height:22px;margin-top:4px"></canvas></div>
<button class="cb" id="prev" aria-label="Previous"></button><button class="cb p" id="pp" aria-label="Play"></button><button class="cb" id="next" aria-label="Next"></button>
<div class="bar"><span id="ps">0:00</span><i><u id="pb" style="width:0%"></u><input class="media-seek" type="range" min="0" max="1000" value="0" aria-label="Seek in current media" disabled></i><span id="pd">0:00</span></div></div></section>

<section class="v" id="v-today"></section>

<section class="v" id="v-stats"></section>

<section class="v" id="v-clipboard"><div class="cbs"><span style="color:var(--mut);display:grid" id="cbsi"></span><input id="cbq" aria-label="Search clipboard" autocomplete="off"><div id="cbf"></div><button class="cb" id="cbg" aria-label="Settings" style="background:none"></button></div><div class="cbm"><div id="cbl"></div><div class="cbp" id="cbp"></div></div><div class="hint"><span><kbd>⏎</kbd>Paste</span><span><kbd>Ctrl C</kbd>Copy</span><span><kbd>Ctrl P</kbd>Pin</span><span><kbd>Del</kbd>Remove</span><i>↑↓ Move • Ctrl/Shift pick several • Tab Filter</i></div></section>
<section class="v" id="v-apps"></section>
<section class="v" id="v-wallpaper"></section>
<section class="v" id="v-power"><div class="g pw-grid" id="pg"></div></section>
</div></div>
<div class="toast" id="toast"></div>
</div>
<!-- Shared state, page modules, initialization, and Windows integration load in dependency order. -->
<script src="app.js"></script>
<script src="../pages/clipboard/renderer/index.js"></script>
<script src="../pages/controls/renderer/index.js"></script>
<script src="../pages/today/renderer/index.js"></script>
<script src="../pages/stats/renderer/index.js"></script>
<script src="../pages/apps/renderer/index.js"></script>
<script src="../pages/wallpaper/renderer/index.js"></script>
<script src="../pages/power/renderer/index.js"></script>
<script src="../pages/settings/renderer/index.js"></script>
<script src="bootstrap.js"></script>
<script src="integrations/windows.js"></script>
</body>
</html>
