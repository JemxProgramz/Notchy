appId: com.notch.desktop
productName: Notch
asar: true
electronDist: node_modules/electron/dist
toolsets:
  winCodeSign: '1.1.0'
directories:
  output: Build-test/appx
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: src/native/build/Release/wireless.node
    to: wireless.node
  - from: src/native/build/Release/audio.node
    to: audio.node
win:
  icon: assets/notch.ico
  target: appx
  artifactName: Notch-${version}-browser-media.${ext}
appx:
  identityName: NotchDesktop
  applicationId: NotchDesktop
  publisher: 'CN=Notch'
  publisherDisplayName: Notch
  backgroundColor: '#0b0b10'
  capabilities:
    - runFullTrust
    - globalMediaControl
